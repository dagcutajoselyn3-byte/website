
<!DOCTYPE html>
<html>
<head>
<title>Christmas Card</title>

<style>
body {
    background: skyblue;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

canvas {
    background: skyblue;
    border: 4px solid white;
}
</style>
</head>

<body>

<canvas id="card" width="600" height="400"></canvas>

<script>
const canvas = document.getElementById("card");
const ctx = canvas.getContext("2d");

// Christmas tree
ctx.fillStyle = "green";
ctx.beginPath();
ctx.moveTo(280, 90);
ctx.lineTo(220, 170);
ctx.lineTo(340, 170);
ctx.closePath();
ctx.fill();

ctx.beginPath();
ctx.moveTo(280, 140);
ctx.lineTo(200, 220);
ctx.lineTo(360, 220);
ctx.closePath();
ctx.fill();

ctx.beginPath();
ctx.moveTo(280, 190);
ctx.lineTo(180, 280);
ctx.lineTo(380, 280);
ctx.closePath();
ctx.fill();

// Tree trunk
ctx.fillStyle = "brown";
ctx.beginPath();
ctx.moveTo(260, 280);
ctx.lineTo(300, 280);
ctx.lineTo(300, 320);
ctx.lineTo(260, 320);
ctx.closePath();
ctx.fill();

// Tree star
ctx.fillStyle = "yellow";
ctx.beginPath();
ctx.moveTo(280, 65);
ctx.lineTo(290, 85);
ctx.lineTo(310, 85);
ctx.lineTo(295, 98);
ctx.lineTo(300, 115);
ctx.lineTo(280, 105);
ctx.lineTo(260, 115);
ctx.lineTo(265, 98);
ctx.lineTo(250, 85);
ctx.lineTo(270, 85);
ctx.closePath();
ctx.fill();

// Christmas balls
ctx.fillStyle = "red";
ctx.beginPath();
ctx.arc(250, 170, 8, 0, Math.PI * 2);
ctx.fill();

ctx.beginPath();
ctx.arc(310, 180, 8, 0, Math.PI * 2);
ctx.fill();

ctx.fillStyle = "yellow";
ctx.beginPath();
ctx.arc(280, 220, 8, 0, Math.PI * 2);
ctx.fill();

ctx.fillStyle = "pink";
ctx.beginPath();
ctx.arc(230, 240, 8, 0, Math.PI * 2);
ctx.fill();

// Christmas Greetings
ctx.fillStyle = "red";
ctx.font = "bold 20px Georgia";
ctx.textAlign = "center";
ctx.fillText("Merry Christmas!", 450, 200);

ctx.fillStyle = "darkgreen";
ctx.font = "14px Georgia";
ctx.fillText("May your days be filled", 450, 235);
ctx.fillText("with joy and love.", 450, 255);

ctx.fillStyle = "red";
ctx.font = "16px Georgia";
ctx.fillText("Happy Holidays!", 450, 290);

// Gift
ctx.fillStyle = "red";
ctx.beginPath();
ctx.moveTo(100, 300);
ctx.lineTo(160, 300);
ctx.lineTo(160, 350);
ctx.lineTo(100, 350);
ctx.closePath();
ctx.fill();

// Gift ribbon
ctx.fillStyle = "yellow";
ctx.beginPath();
ctx.moveTo(125, 300);
ctx.lineTo(135, 300);
ctx.lineTo(135, 350);
ctx.lineTo(125, 350);
ctx.closePath();
ctx.fill();

// Second gift
ctx.fillStyle = "purple";
ctx.beginPath();
ctx.moveTo(150, 320);
ctx.lineTo(200, 320);
ctx.lineTo(200, 355);
ctx.lineTo(150, 355);
ctx.closePath();
ctx.fill();

// Bottom message
ctx.fillStyle = "darkgreen";
ctx.font = "bold 16px Georgia";
ctx.textAlign = "center";
ctx.fillText("Merry Christmas and Happy New Year!", 300, 385);

</script>
</body>
</html>
