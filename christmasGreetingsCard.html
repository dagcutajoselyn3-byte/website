<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christmas Card</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: skyblue;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    color: white;
    font-size: 42px;
    margin-top: 35px;
    text-shadow: 2px 2px #397b9b;
}

.scene {
    position: relative;
    width: 100%;
    max-width: 750px;
    height: 490px;
    margin: 15px auto 0;
    overflow: hidden;
    background: linear-gradient(skyblue 70%, white 70%);
}

/* CHRISTMAS TREE */
.tree {
    position: absolute;
    bottom: 80px;
    left: 12%;
    width: 190px;
    height: 340px;
}

.top {
    position: absolute;
    top: 0;
    left: 83px;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-bottom: 55px solid #176b35;
}

.layer {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 85px solid transparent;
    border-right: 85px solid transparent;
    border-bottom: 120px solid #08752f;
}

.layer.one {
    top: 35px;
}

.layer.two {
    top: 95px;
    border-left-width: 95px;
    border-right-width: 95px;
    border-bottom-width: 130px;
    border-bottom-color: #075d28;
}

.layer.three {
    top: 165px;
    border-left-width: 110px;
    border-right-width: 110px;
    border-bottom-width: 135px;
    border-bottom-color: #08752f;
}

.trunk {
    position: absolute;
    bottom: 0;
    left: 75px;
    width: 40px;
    height: 65px;
    background: #754321;
}

.star {
    position: absolute;
    top: -35px;
    left: 75px;
    font-size: 35px;
    color: gold;
}

.ball {
    position: absolute;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: #ffcf30;
    box-shadow: 0 0 5px white;
}

.b1 { top: 100px; left: 75px; }
.b2 { top: 145px; left: 120px; background: red; }
.b3 { top: 195px; left: 45px; background: red; }
.b4 { top: 225px; left: 145px; }
.b5 { top: 260px; left: 85px; background: red; }

/* SNOWMAN */
.snowman {
    position: absolute;
    bottom: 78px;
    right: 17%;
    width: 150px;
    height: 230px;
}

.head {
    position: absolute;
    top: 0;
    left: 40px;
    width: 75px;
    height: 75px;
    background: white;
    border-radius: 50%;
    box-shadow: inset -7px -6px 10px #c9d9e2;
}

.body {
    position: absolute;
    bottom: 0;
    left: 15px;
    width: 125px;
    height: 135px;
    background: white;
    border-radius: 50%;
    box-shadow: inset -10px -8px 15px #c9d9e2;
}

.eye {
    position: absolute;
    top: 25px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: black;
    z-index: 2;
}

.eye.left { left: 58px; }
.eye.right { left: 90px; }

.nose {
    position: absolute;
    top: 38px;
    left: 72px;
    width: 0;
    height: 0;
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    border-left: 23px solid orange;
    z-index: 2;
}

.scarf {
    position: absolute;
    top: 75px;
    left: 35px;
    width: 90px;
    height: 16px;
    background: red;
    border-radius: 8px;
    z-index: 3;
}

.button {
    position: absolute;
    left: 72px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: black;
    z-index: 3;
}

.button.one { top: 115px; }
.button.two { top: 145px; }
.button.three { top: 175px; }

/* GIFTS */
.gift {
    position: absolute;
    bottom: 80px;
    left: 45%;
    width: 65px;
    height: 55px;
    background: #d92535;
}

.gift::before {
    content: "";
    position: absolute;
    left: 27px;
    height: 55px;
    width: 11px;
    background: gold;
}

.gift::after {
    content: "";
    position: absolute;
    top: -12px;
    left: -5px;
    width: 75px;
    height: 14px;
    background: #a91525;
}

.gift2 {
    position: absolute;
    bottom: 80px;
    left: 55%;
    width: 55px;
    height: 45px;
    background: #2875c7;
}

.gift2::before {
    content: "";
    position: absolute;
    left: 22px;
    height: 45px;
    width: 10px;
    background: gold;
}

.gift2::after {
    content: "";
    position: absolute;
    top: -10px;
    left: -4px;
    width: 63px;
    height: 12px;
    background: #19569a;
}

@media(max-width: 500px) {
    .tree {
        left: 0;
        transform: scale(.75);
        transform-origin: bottom left;
    }

    .snowman {
        right: 0;
        transform: scale(.75);
        transform-origin: bottom right;
    }

    .gift {
        left: 38%;
    }

    .gift2 {
        left: 55%;
    }

    h1 {
        font-size: 32px;
    }
}
</style>
</head>

<body>

<h1>Merry Christmas!</h1>

<div class="scene">

    <div class="tree">
        <div class="star">★</div>
        <div class="top"></div>
        <div class="layer one"></div>
        <div class="layer two"></div>
        <div class="layer three"></div>
        <div class="trunk"></div>

        <div class="ball b1"></div>
        <div class="ball b2"></div>
        <div class="ball b3"></div>
        <div class="ball b4"></div>
        <div class="ball b5"></div>
    </div>

    <div class="snowman">
        <div class="body"></div>
        <div class="head"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="nose"></div>
        <div class="scarf"></div>
        <div class="button one"></div>
        <div class="button two"></div>
        <div class="button three"></div>
    </div>

    <div class="gift"></div>
    <div class="gift2"></div>

</div>

</body>
</html>
