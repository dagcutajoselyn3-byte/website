
<!DOCTYPE html>
<html>
<head>
<title>Christmas Card</title>

<style>
body {
    background: skyblue;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    font-family: Georgia, serif;
}

canvas {
    width: 600px;
    max-width: 95%;
    border: 5px solid white;
    border-radius: 15px;
    background: skyblue;
}
</style>
</head>

<body>

<canvas id="card" width="600" height="600"></canvas>

<script>
const canvas = document.getElementById("card");
const ctx = canvas.getContext("2d");

// Snow
for (let i = 0; i < 80; i++) {
    ctx.beginPath();
    ctx.arc(Math.random() * 600, Math.random() * 600, 2, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();
}

// Ground
ctx.beginPath();
ctx.moveTo(0, 500);
ctx.lineTo(600, 500);
ctx.lineTo(600, 600);
ctx.lineTo(0, 600);
ctx.closePath();
ctx.fillStyle = "white";
ctx.fill();

// Christmas Tree
// Top
ctx.beginPath();
ctx.moveTo(220, 100);
ctx.lineTo(170, 190);
ctx.lineTo(270, 190);
ctx.closePath();
ctx.fillStyle = "green";
ctx.fill();

// Middle
ctx.beginPath();
ctx.moveTo(220, 150);
ctx.lineTo(140, 260);
ctx.lineTo(300, 260);
ctx.closePath();
ctx.fillStyle = "darkgreen";
ctx.fill();

// Bottom
ctx.beginPath();
ctx.moveTo(220, 210);
ctx.lineTo(110, 340);
ctx.lineTo(330, 340);
ctx.closePath();
ctx.fillStyle = "forestgreen";
ctx.fill();

// Tree trunk
ctx.beginPath();
ctx.moveTo(195, 340);
ctx.lineTo(245, 340);
ctx.lineTo(245, 410);
ctx.lineTo(195, 410);
ctx.closePath();
ctx.fillStyle = "brown";
ctx.fill();

// Star
ctx.beginPath();
ctx.moveTo(220, 70);
ctx.lineTo(235, 105);
ctx.lineTo(270, 105);
ctx.lineTo(242, 125);
ctx.lineTo(252, 160);
ctx.lineTo(220, 140);
ctx.lineTo(188, 160);
ctx.lineTo(198, 125);
ctx.lineTo(170, 105);
ctx.lineTo(205, 105);
ctx.closePath();
ctx.fillStyle = "gold";
ctx.fill();

// Tree ornaments
let ornaments = [
    [210, 180], [245, 210], [190, 230],
    [265, 245], [215, 275], [165, 285],
    [285, 300], [230, 320], [180, 315]
];

for (let i = 0; i < ornaments.length; i++) {
    ctx.beginPath();
    ctx.arc(ornaments[i][0], ornaments[i][1], 8, 0, Math.PI * 2);
    ctx.fillStyle = ["red", "yellow", "pink", "blue"][i % 4];
    ctx.fill();
}

// Snowman
ctx.beginPath();
ctx.arc(420, 450, 50, 0, Math.PI * 2);
ctx.fillStyle = "white";
ctx.fill();

ctx.beginPath();
ctx.arc(420, 375, 35, 0, Math.PI * 2);
ctx.fillStyle = "white";
ctx.fill();

// Eyes
ctx.beginPath();
ctx.arc(410, 365, 4, 0, Math.PI * 2);
ctx.arc(430, 365, 4, 0, Math.PI * 2);
ctx.fillStyle = "black";
ctx.fill();

// Nose
ctx.beginPath();
ctx.moveTo(420, 375);
ctx.lineTo(445, 380);
ctx.lineTo(420, 385);
ctx.closePath();
ctx.fillStyle = "orange";
ctx.fill();

// Buttons
ctx.beginPath();
ctx.arc(420, 410, 5, 0, Math.PI * 2);
ctx.arc(420, 430, 5, 0, Math.PI * 2);
ctx.arc(420, 450, 5, 0, Math.PI * 2);
ctx.fillStyle = "black";
ctx.fill();

// Snowman hat
ctx.beginPath();
ctx.moveTo(390, 340);
ctx.lineTo(450, 340);
ctx.lineTo(450, 350);
ctx.lineTo(390, 350);
ctx.closePath();
ctx.fillStyle = "black";
ctx.fill();

ctx.beginPath();
ctx.moveTo(400, 300);
ctx.lineTo(440, 300);
ctx.lineTo(440, 340);
ctx.lineTo(400, 340);
ctx.closePath();
ctx.fillStyle = "black";
ctx.fill();

// Gift 1
ctx.beginPath();
ctx.moveTo(90, 420);
ctx.lineTo(150, 420);
ctx.lineTo(150, 480);
ctx.lineTo(90, 480);
ctx.closePath();
ctx.fillStyle = "red";
ctx.fill();

ctx.beginPath();
ctx.moveTo(115, 420);
ctx.lineTo(125, 420);
ctx.lineTo(125, 480);
ctx.lineTo(115, 480);
ctx.closePath();
ctx.fillStyle = "gold";
ctx.fill();

// Gift 2
ctx.beginPath();
ctx.moveTo(270, 430);
ctx.lineTo(330, 430);
ctx.lineTo(330, 485);
ctx.lineTo(270, 485);
ctx.closePath();
ctx.fillStyle = "purple";
ctx.fill();

ctx.beginPath();
ctx.moveTo(295, 430);
ctx.lineTo(305, 430);
ctx.lineTo(305, 485);
ctx.lineTo(295, 485);
ctx.closePath();
ctx.fillStyle = "yellow";
ctx.fill();

// Gift ribbons
ctx.beginPath();
ctx.moveTo(90, 440);
ctx.lineTo(150, 440);
ctx.moveTo(270, 450);
ctx.lineTo(330, 450);
ctx.strokeStyle = "gold";
ctx.lineWidth = 5;
ctx.stroke();

// Christmas Greeting
ctx.fillStyle = "darkblue";
ctx.font = "bold 30px Georgia";
ctx.textAlign = "center";
ctx.fillText("Merry Christmas!", 300, 40);

ctx.font = "18px Georgia";
ctx.fillText("Wishing you love, joy and peace", 300, 570);

</script>
</body>
</html>
