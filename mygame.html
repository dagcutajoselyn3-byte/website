
<!DOCTYPE html>
<html>
<head>
    <title>Match The FruitGame</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f0f8ff;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        .fruits, .boxes {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px;
            flex-wrap: wrap;
        }

        .fruit {
            font-size: 50px;
            padding: 15px;
            cursor: grab;
            background: white;
            border-radius: 10px;
        }

        .dropbox {
            width: 120px;
            height: 120px;
            border: 3px dashed #555;
            border-radius: 12px;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 18px;
        }

        .dropbox.over {
            background: #d1ffd6;
        }

        #message {
            font-size: 22px;
            font-weight: bold;
            color: green;
        }

        button {
            padding: 12px 25px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>🍎 Match The Fruit Game 🍌</h1>
    <p>Drag the fruit and match it with the correct box!</p>

    <div class="fruits">
        <div class="fruit" draggable="true" id="apple">🍎</div>
        <div class="fruit" draggable="true" id="banana">🍌</div>
        <div class="fruit" draggable="true" id="orange">🍊</div>
    </div>

    <div class="boxes">
        <div class="dropbox" data-answer="apple">
            Apple Box
        </div>

        <div class="dropbox" data-answer="banana">
            Banana Box
        </div>

        <div class="dropbox" data-answer="orange">
            Orange Box
        </div>
    </div>

    <p id="message">Score: 0 / 3</p>

    <button onclick="location.reload()">Restart Game</button>

    <script>
        let score = 0;

        const fruits = document.querySelectorAll(".fruit");
        const boxes = document.querySelectorAll(".dropbox");

        fruits.forEach(fruit => {
            fruit.addEventListener("dragstart", function(e) {
                e.dataTransfer.setData("text", this.id);
            });
        });

        boxes.forEach(box => {

            box.addEventListener("dragover", function(e) {
                e.preventDefault();
                this.classList.add("over");
            });

            box.addEventListener("dragleave", function() {
                this.classList.remove("over");
            });

            box.addEventListener("drop", function(e) {
                e.preventDefault();

                this.classList.remove("over");

                const fruitId = e.dataTransfer.getData("text");
                const fruit = document.getElementById(fruitId);

                if (this.dataset.answer === fruitId &&
                    !this.dataset.completed) {

                    this.innerHTML = fruit.innerHTML + "<br>Correct!";
                    this.dataset.completed = "true";

                    fruit.style.display = "none";

                    score++;

                    document.getElementById("message").innerHTML =
                        "Score: " + score + " / 3";

                    if (score === 3) {
                        document.getElementById("message").innerHTML =
                            "🎉 tama ka! napaka talino mo!";
                    }

                } else {
                    document.getElementById("message").innerHTML =
                        "❌ mali ka! pwede ka umulit!.";
                }
            });
        });
    </script>

</body>
</html>
