<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website</title>
</script>

<body>

<center>

<div style="border: 2px solid rgb(29, 219, 118); width: 400px;">

    <h2 style="background: rgb(29, 152, 219); color: white; margin: 0; padding: 10px;">
        Portal Login
    </h2>
    <div style="padding: 20px 25px;">

        <table style="width: 100%;">
            <tr>
                <td>Username:</td>
            </tr>

            <tr>
                <td>
                    <input type="text"
                           placeholder="Enter Email..."
                           maxlength="50"
                           style="width: 100%; padding: 8px; box-sizing: border-box;">
                </td>
            </tr>

            <tr>
                <td style="padding-top: 15px;">Password:</td>
            </tr>

            <tr>
                <td>
                    <input type="password"
                           placeholder="Enter Password"
                           required
                           style="width: 100%; padding: 8px; box-sizing: border-box;">
                </td>
            </tr>
        </table>

        <p>
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </p>

        <p>Created by: Joselyn Dagcuta - 12 Cooper</p>

    </div>

</div>

</center>

</body>
</html>
